name: Deploy Texas OS + Optional Same-Origin AI Pack
on:
  workflow_dispatch:
    inputs:
      model_pack:
        description: "Optional same-origin browser model pack to include in the Pages artifact"
        required: true
        default: "none"
        type: choice
        options:
          - none
          - fallback-360m
          - standard-1b
          - advanced-3b
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Vendor WebLLM runtime
        run: python tools/vendor_webllm.py
      - name: Build selected offline model pack
        if: ${{ inputs.model_pack != 'none' }}
        shell: bash
        run: |
          case "${{ inputs.model_pack }}" in
            fallback-360m) MODEL="SmolLM2-360M-Instruct-q4f32_1-MLC" ;;
            standard-1b) MODEL="Llama-3.2-1B-Instruct-q4f32_1-MLC" ;;
            advanced-3b) MODEL="Llama-3.2-3B-Instruct-q4f32_1-MLC" ;;
          esac
          python tools/download_model_pack.py "$MODEL"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
